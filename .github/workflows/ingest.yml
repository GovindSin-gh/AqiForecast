name: hourly-ingest

on:
  schedule:
    - cron: "7 * * * *"      # scheduled runs can start late; that is normal
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run Open-Meteo ingest
        timeout-minutes: 8
        run: |
          sleep $((RANDOM % 25))
          python -m src.ingest.open_meteo
