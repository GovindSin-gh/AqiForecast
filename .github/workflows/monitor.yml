name: hourly-monitor
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
permissions:
  actions: write
concurrency: {group: monitor, cancel-in-progress: false}
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-monitor.txt
      - run: python -m src.monitoring.predict
      - id: score
        run: python -m src.monitoring.score
      - run: python -m src.monitoring.drift
      - name: Extra retrain if error stayed high
        if: steps.score.outputs.alert == 'true'
        run: gh workflow run retrain.yml
        env:
          GH_TOKEN: ${{ github.token }}
