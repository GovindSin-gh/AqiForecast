name: daily-retrain

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST (cron is UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Configure DVC remote (DagsHub, S3-compatible)
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}
      - run: dvc repro
      - run: dvc push
      - run: python -m src.models.gate --candidate models/candidate.pt
      - name: Commit dvc.lock
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dvc.lock
          git diff --cached --quiet || (git commit -m "chore: update dvc.lock [skip ci]" && git push)
      - name: Notify on failure
        if: failure() && env.ALERT_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d '{"content":"AQI retrain failed. Check the Actions tab.","text":"AQI retrain failed. Check the Actions tab."}' \
            "$ALERT_WEBHOOK_URL"
