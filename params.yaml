cities:
  - {id: delhi, name: Delhi, lat: 28.61, lon: 77.21}
  - {id: lucknow, name: Lucknow, lat: 26.85, lon: 80.95}
  - {id: kanpur, name: Kanpur, lat: 26.45, lon: 80.35}
  - {id: kolkata, name: Kolkata, lat: 22.57, lon: 88.36}
  - {id: mumbai, name: Mumbai, lat: 19.08, lon: 72.88}
  - {id: hyderabad, name: Hyderabad, lat: 17.39, lon: 78.49}
  - {id: chennai, name: Chennai, lat: 13.08, lon: 80.27}
  - {id: bengaluru, name: Bengaluru, lat: 12.97, lon: 77.59}

features:
  window: 48        # hours of history the model reads
  horizon: 24       # hours ahead the model predicts
  stride: 3         # keep every 3rd training window (neighbours are near-duplicates)
  split: {train: 0.70, val: 0.15}  # the rest is test; always split by time

train:
  hidden: 64
  layers: 2
  dropout: 0.1
  emb: 8
  batch_size: 256
  epochs: 30
  patience: 5
  lr: 0.001
  seed: 42

gate:   # starting points, tune after you see real numbers
  min_improvement: 0.02       # candidate MAE must be this much better
  max_horizon_regression: 0.05 # t+h MAE must not be worse than this
  coverage_low: 0.70
  coverage_high: 0.90

monitor:
  alert_ratio: 1.3    # rolling MAE / baseline MAE
  alert_hours: 3      # consecutive hourly checks above the ratio
  stale_hours: 3      # no new data for this long = stale
